version: '3.8'

services:
  # 1. 메인 관계형 데이터베이스
  postgres:
    image: postgres:16-alpine
    container_name: job_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_platform
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. 고속 인메모리 캐시 & 세션/레이트리밋
  redis:
    image: redis:7-alpine
    container_name: job_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Zookeeper (Kafka 분산 코디네이터)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: job_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 4. Apache Kafka (대용량 비동기 크롤링 파이프라인)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: job_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
  redis_data:
